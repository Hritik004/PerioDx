<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>PerioDx — Periodontal Health Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Markdown parser + sanitizer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  :root{
    --violet-1:#6a5ff0;
    --violet-2:#8b5cf6;
    --violet-3:#4f46e5;
    --ink:#211f36;
    --muted:#6b6885;
    --card:#ffffff;
    --hair:rgba(33,31,54,0.08);
    --mint:#00c896;
    --amber:#f5a524;
    --rose:#f0556a;
    --bg-1:rgba(139,92,246,0.12);
    --bg-2:rgba(106,95,240,0.10);
    --bg-base:#f7f6fb;
    --field-bg:#fbfaff;
    --surface-tint:rgba(33,31,54,0.05);
    --icon-tint:rgba(33,31,54,0.06);
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;

    --header-h:64px;
    --input-h:64px;
    --kb-offset:0px;
  }

  html[data-theme="dark"]{
    --violet-1:#5b8cff;
    --violet-2:#7fa8ff;
    --violet-3:#3d6ae8;
    --ink:#eef1f8;
    --muted:#8992ab;
    --card:#161a24;
    --hair:rgba(255,255,255,0.10);
    --mint:#34e0a6;
    --amber:#ffb84d;
    --rose:#ff6b81;
    --bg-1:rgba(91,140,255,0.14);
    --bg-2:rgba(52,224,166,0.06);
    --bg-base:#0a0c12;
    --field-bg:#1c2029;
    --surface-tint:rgba(255,255,255,0.06);
    --icon-tint:rgba(255,255,255,0.09);
  }

  *{box-sizing:border-box;}

  html, body{
    height:100%;
    overscroll-behavior:none;
    background:var(--bg-base);
  }

  body{
    font-family:var(--font-body);
    margin:0;
    padding:0;
    background:
      radial-gradient(1100px 600px at 90% -10%, var(--bg-1), transparent),
      radial-gradient(900px 500px at -10% 30%, var(--bg-2), transparent),
      var(--bg-base);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100dvh;
    height:100vh;
    overflow:hidden;
    transition:background-color 0.25s ease, color 0.25s ease;
  }

  /* ---------- Fixed header ---------- */
  header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:20;
    height:var(--header-h);
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    padding-top:env(safe-area-inset-top);
    pointer-events:none;
  }

  header > *{ pointer-events:auto; }

  .brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:opacity 0.3s ease, transform 0.3s ease;
  }

  .brand-row .dot{
    width:9px;height:9px;border-radius:2px;
    background:linear-gradient(135deg,var(--violet-1),var(--mint));
    flex-shrink:0;
  }

  .brand-row h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin:0;
  }

  /* ---------- Report-loaded banner ---------- */
  .report-banner-wrap{
    position:fixed;
    top:calc(var(--header-h) + env(safe-area-inset-top) + 6px);
    left:0; right:0;
    z-index:19;
    display:flex;
    justify-content:center;
    padding:0 16px;
    pointer-events:none;
  }

  .report-banner{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:10px;
    max-width:560px;
    width:100%;
    background:linear-gradient(135deg, rgba(106,95,240,0.14), rgba(0,200,150,0.10));
    border:1px solid rgba(106,95,240,0.28);
    border-radius:14px;
    padding:9px 12px 9px 10px;
    font-size:12.5px;
    color:var(--ink);
    box-shadow:0 10px 26px rgba(76,63,180,0.14);
    opacity:0;
    transform:translateY(-8px);
    transition:opacity 0.22s ease, transform 0.22s ease;
    cursor:pointer;
  }
  .report-banner.show{ opacity:1; transform:translateY(0); }
  .report-banner:hover{ border-color:rgba(106,95,240,0.45); }

  .report-banner .rb-ic{
    width:26px;height:26px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,var(--violet-1),var(--violet-3));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .report-banner .rb-ic svg{ width:14px; height:14px; }

  .report-banner .rb-text{ flex:1; min-width:0; line-height:1.35; }
  .report-banner .rb-title{
    font-weight:600; font-size:12.5px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .report-banner .rb-sub{
    font-family:var(--font-mono);
    font-size:10.5px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .report-banner .rb-hint{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--violet-3);
    white-space:nowrap;
    margin-left:2px;
    opacity:0.85;
    flex-shrink:0;
  }

  .report-banner .rb-dismiss{
    flex-shrink:0;
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    background:transparent;
    border:none;cursor:pointer;
  }
  .report-banner .rb-dismiss:hover{ background:var(--surface-tint); color:var(--ink); }

  /* ---------- Report JSON modal ---------- */
  .json-modal-overlay{
    position:fixed;inset:0;background:rgba(33,31,54,0.45);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
    z-index:340;padding:20px;
  }
  html[data-theme="dark"] .json-modal-overlay{ background:rgba(2,3,7,0.78); }
  .json-modal-overlay.show{opacity:1;pointer-events:auto;}
  .json-modal-box{
    background:var(--card);border:1px solid var(--hair);border-radius:18px;
    width:100%;max-width:560px;max-height:80vh;
    padding:20px 22px;box-shadow:0 30px 70px rgba(0,0,0,0.35);
    display:flex;flex-direction:column;
  }
  .json-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .json-modal-head h3{font-family:var(--font-display);font-size:1.05rem;font-weight:600;}
  .json-modal-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .json-modal-pre{
    flex:1;overflow:auto;background:var(--field-bg);border:1px solid var(--hair);
    border-radius:12px;padding:14px;font-family:var(--font-mono);font-size:12px;
    line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word;
  }
  .json-modal-actions{display:flex;justify-content:flex-end;margin-top:12px;}
  .json-modal-copy-btn{
    font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;
    padding:9px 14px;border-radius:100px;
    transition:background-color .15s ease, color .15s ease;
  }
  .json-modal-copy-btn:hover{ background:var(--surface-tint); color:var(--violet-3); }

  /* ---------- Scrollable chat area ---------- */
  #chat-box{
    flex:1;
    width:100%;
    margin:0;
    padding:calc(var(--header-h) + env(safe-area-inset-top) + 16px) 0 calc(var(--input-h) + env(safe-area-inset-bottom) + 32px + var(--kb-offset));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
    transition:padding-bottom 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #chat-box.has-banner{
    padding-top:calc(var(--header-h) + env(safe-area-inset-top) + 52px);
  }

  .chat-inner{
    max-width:820px;
    width:100%;
    margin:0 auto;
    padding:0 28px;
  }

  @media (max-width: 480px){
    .chat-inner{ padding:0 14px; }
  }

  #chat-box::-webkit-scrollbar{width:6px;}
  #chat-box::-webkit-scrollbar-thumb{background:var(--hair);border-radius:8px;}

  .message {
    display: flex;
    flex-direction: column;
    margin-bottom: 14px;
    animation: rise 0.25s ease-out;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .message.user-msg { align-items: flex-end; }
  .message.ai-msg { align-items: flex-start; }

  .bubble{
    max-width:82%;
    padding:11px 15px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.5;
    position:relative;
  }

  .sender-label{
    display:block;
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin-bottom:4px;
    opacity:0.7;
  }

  .msg-text{
    word-wrap:break-word;
  }

  .user-msg .bubble{
    background:linear-gradient(135deg,var(--violet-1),var(--violet-3));
    color:#fff;
    box-shadow:0 8px 20px rgba(76,63,180,0.22);
  }
  .user-msg .sender-label{ display:none; }

  .ai-msg .bubble{
    background:transparent !important;
    color:var(--ink);
    border:none !important;
    box-shadow:none !important;
    padding:0;
    max-width:100%;
    width:100%;
  }
  .ai-msg:not(.system) .sender-label{ display:none; }

  .ai-msg.system .bubble{
    background:rgba(240,85,106,0.08);
    color:var(--rose);
    border:1px solid rgba(240,85,106,0.25) !important;
    padding:10px 14px !important;
    border-radius:12px !important;
  }

  .welcome-note{
    max-width:460px;
    margin:8px auto 26px;
    padding:18px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.65;
    background:var(--card);
    border:1px dashed var(--hair);
    border-radius:16px;
    transition:background-color 0.25s ease, border-color 0.25s ease;
  }
  .welcome-note .welcome-title{
    display:block;
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    color:var(--violet-3);
    margin-bottom:5px;
    letter-spacing:0.01em;
  }

  /* ---------- Markdown content styling ---------- */
  .ai-msg .msg-text p{ margin:0 0 8px; }
  .ai-msg .msg-text p:last-child{ margin-bottom:0; }
  .ai-msg .msg-text ul, .ai-msg .msg-text ol{ margin:6px 0; padding-left:20px; }
  .ai-msg .msg-text li{ margin-bottom:3px; }
  .ai-msg .msg-text h1,
  .ai-msg .msg-text h2,
  .ai-msg .msg-text h3,
  .ai-msg .msg-text h4{
    font-family:var(--font-display);
    font-weight:600;
    color:var(--violet-3);
    margin:14px 0 6px;
    line-height:1.3;
  }
  .ai-msg .msg-text h1{ font-size:1.25em; }
  .ai-msg .msg-text h2{ font-size:1.15em; }
  .ai-msg .msg-text h3{ font-size:1.05em; }
  .ai-msg .msg-text blockquote{
    margin:8px 0;
    padding:4px 12px;
    border-left:3px solid var(--violet-1);
    color:var(--muted);
    background:var(--surface-tint);
    border-radius:0 8px 8px 0;
  }
  .ai-msg .msg-text code{
    background:var(--surface-tint);
    padding:1px 5px;
    border-radius:5px;
    font-size:0.9em;
    font-family:var(--font-mono);
  }
  .ai-msg .msg-text pre{
    background:var(--surface-tint);
    padding:10px 12px;
    border-radius:10px;
    overflow-x:auto;
    margin:8px 0;
  }
  .ai-msg .msg-text pre code{ background:none; padding:0; }
  .ai-msg .msg-text a{ color:var(--violet-3); text-decoration:underline; }
  .ai-msg .msg-text strong{ font-weight:600; color:var(--ink); }
  .ai-msg .msg-text table{
    border-collapse:collapse;
    width:100%;
    margin:8px 0;
    font-size:0.95em;
  }
  .ai-msg .msg-text th,
  .ai-msg .msg-text td{
    border:1px solid var(--hair);
    padding:6px 10px;
    text-align:left;
  }
  .ai-msg .msg-text th{
    background:var(--surface-tint);
    font-family:var(--font-display);
    font-weight:600;
  }
  .ai-msg .msg-text hr{
    border:none;
    border-top:1px solid var(--hair);
    margin:12px 0;
  }

  /* ---------- Action buttons ---------- */
  .action-container{
    display:flex;
    justify-content:flex-end;
    margin-top:6px;
    opacity:0;
    transition:opacity 0.15s ease;
    pointer-events:none;
  }

  .message:hover .action-container,
  .message.show-actions .action-container{
    opacity:1;
    pointer-events:auto;
  }

  @media (hover: none){
    .action-container{ opacity:0; }
  }

  .action-btn{
    background:transparent;
    border:none;
    cursor:pointer;
    opacity:0.7;
    transition:opacity 0.2s, background 0.2s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    border-radius:50%;
    color:var(--muted);
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }

  .action-btn:hover, .action-btn:active {
    opacity:1;
    background:var(--surface-tint);
    color:var(--violet-3);
  }

  .action-btn svg{
    width:14px;
    height:14px;
  }

  .typing-dots{
    display:flex;
    gap:4px;
    padding:4px 2px;
  }
  .typing-dots span{
    width:6px;height:6px;border-radius:50%;
    background:var(--violet-1);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:0.15s;}
  .typing-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,80%,100%{transform:translateY(0); opacity:0.5;}
    40%{transform:translateY(-4px); opacity:1;}
  }

  /* ---------- Fixed input bar ---------- */
  .input-bar-wrap{
    position:fixed;
    left:0; right:0;
    bottom:var(--kb-offset);
    z-index:30;
    background:transparent;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    transition:bottom 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    will-change:bottom;
  }

  .input-area{
    display:flex;
    align-items:center;
    gap:8px;
    max-width:820px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--hair);
    border-radius:28px;
    padding:8px 8px 8px 18px;
    box-shadow:0 12px 30px rgba(76,63,180,0.10);
    transition:background-color 0.25s ease, border-color 0.25s ease;
  }

  textarea#user-input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-size:15px;
    font-family:var(--font-body);
    color:var(--ink);
    padding:8px 0;
    min-width:0;
    resize:none;
    max-height:120px;
    line-height:1.4;
  }

  textarea#user-input::placeholder{
    color:var(--muted);
    opacity:0.8;
  }

  button.icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-family:var(--font-body);
    transition:background 0.15s, transform 0.1s, color 0.15s;
    -webkit-tap-highlight-color:transparent;
  }

  button.icon-btn:active{ transform:scale(0.94); }

  #mic-btn{
    background:transparent;
    color:var(--violet-3);
  }
  #mic-btn:hover{ background:var(--surface-tint); }
  #mic-btn.listening{
    background:var(--rose);
    color:#fff;
    animation:pulse-mic 1.1s infinite;
  }
  @keyframes pulse-mic{
    0%,100%{ box-shadow:0 0 0 0 rgba(240,85,106,0.45); }
    50%{ box-shadow:0 0 0 6px rgba(240,85,106,0); }
  }

  #send-btn{
    background:linear-gradient(135deg,var(--violet-1),var(--violet-3));
    color:#fff;
  }
  #send-btn:hover:not(:disabled){ filter:brightness(1.06); }
  #send-btn:disabled{ background:var(--hair); color:var(--muted); cursor:not-allowed; }

  button.icon-btn:focus-visible{
    outline:2px solid var(--violet-1);
    outline-offset:2px;
  }

  textarea#user-input:focus,
  textarea#user-input:focus-visible{
    outline:none;
    box-shadow:none;
  }

  @media (prefers-reduced-motion: reduce){
    .message{ animation:none; }
    .typing-dots span{ animation:none; }
    #mic-btn.listening{ animation:none; }
  }

</style>
</head>
<body>

<header>
  <div class="brand-row">
    <span class="dot"></span>
    <h1>PerioDx</h1>
  </div>
</header>

<div class="report-banner-wrap" id="report-banner-wrap">
  <div class="report-banner" id="report-banner" role="button" tabindex="0" aria-label="View the raw JSON sent to the AI assistant">
    <div class="rb-ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="9" y1="13" x2="15" y2="13"></line>
        <line x1="9" y1="17" x2="13" y2="17"></line>
      </svg>
    </div>
    <div class="rb-text">
      <div class="rb-title" id="report-banner-title">Patient report loaded</div>
      <div class="rb-sub" id="report-banner-sub"></div>
    </div>
    <span class="rb-hint">View JSON →</span>
    <button class="rb-dismiss" id="report-banner-dismiss" type="button" aria-label="Dismiss">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="json-modal-overlay" id="jsonModalOverlay">
  <div class="json-modal-box">
    <div class="json-modal-head">
      <h3>Data sent to AI assistant</h3>
      <button class="rb-dismiss" id="jsonModalClose" type="button" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="json-modal-sub">This is the exact per-tooth JSON the model uses to answer — not the raw scan cache.</div>
    <pre class="json-modal-pre" id="jsonModalPre">Loading…</pre>
    <div class="json-modal-actions">
      <button class="json-modal-copy-btn" id="jsonModalCopy" type="button">Copy JSON</button>
    </div>
  </div>
</div>

<div id="chat-box"><div class="chat-inner" id="chat-inner"></div></div>

<div class="input-bar-wrap" id="input-bar-wrap">
  <div class="input-area">
    <button id="mic-btn" class="icon-btn" type="button" aria-label="Speak your message" title="Speak">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 11a7 7 0 0 1-14 0M12 19v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <textarea id="user-input" rows="1" placeholder="Ask about gum health..."
      autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true"
      name="periodx-message-field" data-form-type="other" data-lpignore="true" data-1p-ignore="true"
      enterkeyhint="send"></textarea>

    <button id="send-btn" class="icon-btn" type="button" aria-label="Send message" title="Send">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12L21 3L14 21L11 13L3 12Z" fill="white"/>
      </svg>
    </button>
  </div>
</div>

<script>
  let conversationHistory = [];
  let recognizing = false;
  let recognition = null;
  let editingHistoryIndex = null;
  let reportBannerDismissed = false;
  let activeReportId = null;
  let activeSavedReportId = null;
  let activeReportMeta = null;

  const chatBox = document.getElementById("chat-box");
  const chatInner = document.getElementById("chat-inner");
  const inputField = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const micBtn = document.getElementById("mic-btn");
  const inputBarWrap = document.getElementById("input-bar-wrap");

  const reportBannerWrap = document.getElementById("report-banner-wrap");
  const reportBanner = document.getElementById("report-banner");
  const reportBannerTitle = document.getElementById("report-banner-title");
  const reportBannerSub = document.getElementById("report-banner-sub");
  const reportBannerDismiss = document.getElementById("report-banner-dismiss");

  const jsonModalOverlay = document.getElementById("jsonModalOverlay");
  const jsonModalPre = document.getElementById("jsonModalPre");
  const jsonModalClose = document.getElementById("jsonModalClose");
  const jsonModalCopy = document.getElementById("jsonModalCopy");

  const GREETING = "Hi, I'm PerioDx. Ask me about gum disease symptoms, causes, or treatment options — I'm here to help you understand periodontal health.";

  /* ---------- Markdown rendering helper ---------- */
  function renderMarkdown(text) {
    try {
      const rawHtml = marked.parse(text, { breaks: true, gfm: true });
      return DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target'] });
    } catch (err) {
      console.error("Markdown render failed, falling back to escaped text", err);
      return escapeHtml(text);
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    // 1. Clears backend memory when page loads/reloads
    fetch("/clear_chat", { method: "POST" }).catch(console.error);

    // 2. Enables microphone/voice input
    setupSpeechRecognition();

    // 3. Matches whatever theme is active on the PerioDx dashboard
    //    (the dashboard is same-origin, so its saved choice in
    //    localStorage is shared with this page automatically).
    syncThemeWithDashboard();

    // 4. Picks up a report handed off from the diagnosis dashboard (see
    //    openAIChat() in dashboard_user.html), which stashes it in
    //    sessionStorage right before opening this page. Falls back to a
    //    ?report_id= query param so a plain link still works.
    loadHandedOffReport();

    // 5. Renders the initial welcome state
    conversationHistory = [];
    renderHistoryToDOM(conversationHistory);
  });

  function loadHandedOffReport() {
    let handoff = null;
    try {
      const raw = sessionStorage.getItem("periodx_active_report");
      if (raw) handoff = JSON.parse(raw);
    } catch (err) {
      console.error("Could not read handed-off report", err);
    }

    if (!handoff) {
      const params = new URLSearchParams(window.location.search);
      const paramReportId = params.get("report_id");
      if (paramReportId) handoff = { report_id: paramReportId };
    }

    if (!handoff || (!handoff.report_id && !handoff.saved_report_id)) return;

    activeReportId = handoff.report_id || null;
    activeSavedReportId = handoff.saved_report_id || null;
    activeReportMeta = handoff;

    showReportBanner({
      id: handoff.report_id || handoff.saved_report_id,
      patient_name: handoff.patient_name || null,
      patient_id: handoff.patient_id || null,
      stage: handoff.periodontitis_stage || handoff.stage || null
    });
  }

  /* ---------- Theme: mirror the PerioDx dashboard ----------
     The dashboard (dashboard_user.html) stores its light/dark choice
     under the 'periodx-theme' key in localStorage. Since this page is
     served from the same origin and opened in an iframe on that
     dashboard, we just read the same key — no separate toggle here,
     and no drift between the two UIs.
  */
  const THEME_KEY = 'periodx-theme';

  function applyTheme(mode) {
    document.documentElement.setAttribute("data-theme", mode === "dark" ? "dark" : "light");
  }

  function syncThemeWithDashboard() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}

    if (saved === "dark" || saved === "light") {
      applyTheme(saved);
    } else {
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(prefersDark ? "dark" : "light");
    }

    // Stay in sync if the dashboard theme changes while this page is open
    // (e.g. toggled in another same-origin tab/frame).
    window.addEventListener("storage", (e) => {
      if (e.key === THEME_KEY && (e.newValue === "dark" || e.newValue === "light")) {
        applyTheme(e.newValue);
      }
    });
  }

  /* ---------- Report-loaded banner ----------
     Shown whenever a backend response for a chat turn indicates a saved
     patient report was pulled into context, e.g.
     { "response": "...", "report": { "id": 12, "patient_name": "Jane Doe", "stage": "Stage II" } }
  */
  function showReportBanner(report) {
    if (!report || reportBannerDismissed) return;

    const patientName = report.patient_name || report.name || null;
    const patientId = report.patient_id || null;
    const reportId = report.id || report.report_id || null;
    const stage = report.stage || report.periodontitis_stage || null;

    if (patientName) {
      reportBannerTitle.textContent = `Report loaded — ${patientName}`;
    } else if (patientId) {
      reportBannerTitle.textContent = `Report loaded — Patient #${patientId}`;
    } else {
      reportBannerTitle.textContent = "Diagnostic report loaded";
    }

    const subParts = [];
    if (reportId) subParts.push(`#${String(reportId).slice(0, 8)}`);
    if (stage) subParts.push(stage);
    reportBannerSub.textContent = subParts.join(" · ");

    reportBanner.classList.add("show");
    chatBox.classList.add("has-banner");
  }

  function hideReportBanner() {
    reportBanner.classList.remove("show");
    chatBox.classList.remove("has-banner");
  }

  reportBannerDismiss.addEventListener("click", (e) => {
      e.stopPropagation();

      reportBannerDismissed = true;
      activeReportId = null;
      activeSavedReportId = null;
      activeReportMeta = null;

      try {
        sessionStorage.removeItem("periodx_active_report");
      } catch (err) {}

      hideReportBanner();
  });

  /* ---------- Report JSON modal ----------
     Clicking the banner fetches the exact distilled per-tooth JSON that
     /ask_perio_ai sends to the SLM for the active report (see
     /api/slm-report-json/<report_id> in app.py) — not the raw
     report_cache blob, which also carries the four base64 report images.
  */
  async function openReportJsonModal() {
    if (!activeReportId && !activeSavedReportId) return;

    jsonModalPre.textContent = "Loading…";
    jsonModalOverlay.classList.add("show");

    try {
      const endpoint = activeSavedReportId
       ? `/api/slm-saved-report-json/${encodeURIComponent(activeSavedReportId)}`
       : `/api/slm-report-json/${encodeURIComponent(activeReportId)}`;

      const res = await fetch(endpoint);
      const data = await res.json();
      if (!res.ok || !data.success) {
        throw new Error(data.error || "Could not load report JSON.");
      }
      jsonModalPre.textContent = JSON.stringify(data.report, null, 2);
    } catch (err) {
      jsonModalPre.textContent = "Error: " + err.message;
    }
  }

  function closeReportJsonModal() {
    jsonModalOverlay.classList.remove("show");
  }

  reportBanner.addEventListener("click", (e) => {
    if (e.target.closest(".rb-dismiss")) return;
    openReportJsonModal();
  });
  reportBanner.addEventListener("keydown", (e) => {
    if (e.target.closest(".rb-dismiss")) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openReportJsonModal();
    }
  });

  jsonModalClose.addEventListener("click", closeReportJsonModal);
  jsonModalOverlay.addEventListener("click", (e) => {
    if (e.target === jsonModalOverlay) closeReportJsonModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && jsonModalOverlay.classList.contains("show")) closeReportJsonModal();
  });

  jsonModalCopy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(jsonModalPre.textContent);
      jsonModalCopy.textContent = "Copied!";
      setTimeout(() => { jsonModalCopy.textContent = "Copy JSON"; }, 1500);
    } catch (err) {
      console.error("Copy failed", err);
    }
  });

  /* ---------- Rendering ---------- */
  function renderWelcomeNote() {
    const note = document.createElement("div");
    note.className = "welcome-note";
    const text = activeReportId
      ? "Hi, I'm PerioDx. I've got your latest scan loaded, so feel free to ask about this specific report — or anything about gum disease symptoms, causes, and treatment in general."
      : GREETING;
    note.innerHTML = `<span class="welcome-title">Welcome</span>${escapeHtml(text)}`;
    chatInner.appendChild(note);
  }

  function renderHistoryToDOM(history) {
    chatInner.innerHTML = "";
    if (history.length === 0) {
      renderWelcomeNote();
      return;
    }
    history.forEach((msg, idx) => {
      if (msg.role === "user") {
        appendMessage("You", msg.content, "user-msg", idx);
      } else {
        appendMessage("PerioDx", msg.content, "ai-msg", idx);
      }
    });
  }

  /* ---------- Keep input bar and chat area above on-screen keyboard ---------- */
  function updateKeyboardOffset() {
    if (!window.visualViewport) return;
    const vv = window.visualViewport;
    const offset = Math.max(window.innerHeight - vv.height - vv.offsetTop, 0);
    document.documentElement.style.setProperty("--kb-offset", offset + "px");

    if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0) {
      window.scrollTo(0, 0);
    }

    setTimeout(() => {
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 50);
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", updateKeyboardOffset);
    window.visualViewport.addEventListener("scroll", updateKeyboardOffset);
  }

  inputField.addEventListener("focus", () => {
    setTimeout(updateKeyboardOffset, 150);
  });
  inputField.addEventListener("blur", () => {
    document.documentElement.style.setProperty("--kb-offset", "0px");
  });

  /* ---------- Sending messages ---------- */
  async function sendMessage() {
    const userText = inputField.value.trim();
    if (!userText) return;

    if (editingHistoryIndex !== null) {
      const targetWrapper = document.querySelector(`.message[data-history-index="${editingHistoryIndex}"]`);
      if (targetWrapper) {
        let current = targetWrapper;
        while (current) {
          let next = current.nextElementSibling;
          current.remove();
          current = next;
        }
      }
      conversationHistory = conversationHistory.slice(0, editingHistoryIndex);
      editingHistoryIndex = null;
    }

    const welcomeNote = chatInner.querySelector(".welcome-note");
    if (welcomeNote) welcomeNote.remove();

    conversationHistory.push({ role: "user", content: userText });
    const userHistIndex = conversationHistory.length - 1;

    appendMessage("You", userText, "user-msg", userHistIndex);
    inputField.value = "";
    inputField.style.height = "auto";
    sendBtn.disabled = true;

    const typingId = showTyping();

    try {
      const response = await fetch("/ask_perio_ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: userText,
          history: conversationHistory,
          report_id: activeReportId || undefined,
          saved_report_id: activeSavedReportId || undefined
        })
      });
      const data = await response.json();
      removeTyping(typingId);

      if (response.ok) {
        conversationHistory.push({ role: "assistant", content: data.response });
        const aiHistIndex = conversationHistory.length - 1;
        appendMessage("PerioDx", data.response, "ai-msg", aiHistIndex);

        // Surface a sign whenever the backend attached patient-report context
        if (data.report) {
          showReportBanner(data.report);
        }
      } else {
        appendMessage("System", "Error: " + data.error, "ai-msg system");
      }
    } catch (error) {
      removeTyping(typingId);
      const fallbackResp = "This is a fallback response. I heard: " + userText;
      conversationHistory.push({ role: "assistant", content: fallbackResp });
      const aiHistIndex = conversationHistory.length - 1;
      appendMessage("PerioDx", fallbackResp, "ai-msg", aiHistIndex);
    } finally {
      sendBtn.disabled = false;
      setTimeout(updateKeyboardOffset, 50);
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputField.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
  inputField.addEventListener("input", () => {
    inputField.style.height = "auto";
    inputField.style.height = Math.min(inputField.scrollHeight, 120) + "px";
  });

  /* ---------- Render Chat Messages & Handle Actions ---------- */
  function appendMessage(sender, text, className, historyIndex = null) {
    const wrapper = document.createElement("div");
    wrapper.className = `message ${className}`;
    if (historyIndex !== null) {
      wrapper.dataset.historyIndex = historyIndex;
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const senderLabel = document.createElement("span");
    senderLabel.className = "sender-label";
    senderLabel.textContent = sender;

    const msgText = document.createElement("div");
    msgText.className = "msg-text";

    if (className.includes("ai-msg") && !className.includes("system")) {
      msgText.innerHTML = renderMarkdown(text);
    } else {
      msgText.innerHTML = escapeHtml(text);
    }

    bubble.appendChild(senderLabel);
    bubble.appendChild(msgText);
    wrapper.appendChild(bubble);

    const actionContainer = document.createElement("div");
    actionContainer.className = "action-container";

    if (className.includes("user-msg")) {
      const editBtn = document.createElement("button");
      editBtn.className = "action-btn";
      editBtn.title = "Edit prompt";
      editBtn.setAttribute("aria-label", "Edit prompt");
      editBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      `;

      editBtn.addEventListener("click", () => {
        inputField.value = text;
        inputField.focus();
        inputField.dispatchEvent(new Event('input'));
        editingHistoryIndex = historyIndex;
      });

      actionContainer.appendChild(editBtn);
      actionContainer.appendChild(createCopyButton(text, "Copy prompt"));
      wrapper.appendChild(actionContainer);
    }
    else if (className.includes("ai-msg") && !className.includes("system")) {
      const retryBtn = document.createElement("button");
      retryBtn.className = "action-btn";
      retryBtn.title = "Regenerate response";
      retryBtn.setAttribute("aria-label", "Regenerate response");
      retryBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      `;

      retryBtn.addEventListener("click", () => {
        if (historyIndex !== null && historyIndex > 0) {
          const lastUserText = conversationHistory[historyIndex - 1].content;
          inputField.value = lastUserText;
          editingHistoryIndex = historyIndex - 1;
          sendMessage();
        }
      });

      actionContainer.appendChild(retryBtn);
      actionContainer.appendChild(createCopyButton(text, "Copy response"));
      wrapper.appendChild(actionContainer);
    }

    chatInner.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
    attachActionToggle(wrapper);
  }

  function createCopyButton(text, label) {
    const copyBtn = document.createElement("button");
    copyBtn.className = "action-btn";
    copyBtn.title = label;
    copyBtn.setAttribute("aria-label", label);

    const copyIcon = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    `;
    const checkIcon = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    `;

    copyBtn.innerHTML = copyIcon;
    copyBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.innerHTML = checkIcon;
        setTimeout(() => { copyBtn.innerHTML = copyIcon; }, 2000);
      } catch (err) {
        console.error("Copy failed", err);
      }
    });

    return copyBtn;
  }

  /* ---------- Reveal action buttons on hover (desktop) or long-press (touch) ---------- */
  function attachActionToggle(wrapper) {
    let pressTimer = null;
    wrapper.addEventListener("touchstart", () => {
      pressTimer = setTimeout(() => {
        document.querySelectorAll(".message.show-actions").forEach(el => {
          if (el !== wrapper) el.classList.remove("show-actions");
        });
        wrapper.classList.add("show-actions");
      }, 420);
    }, { passive: true });
    wrapper.addEventListener("touchend", () => clearTimeout(pressTimer), { passive: true });
    wrapper.addEventListener("touchmove", () => clearTimeout(pressTimer), { passive: true });
  }

  document.addEventListener("touchstart", (e) => {
    document.querySelectorAll(".message.show-actions").forEach(el => {
      if (!el.contains(e.target)) el.classList.remove("show-actions");
    });
  }, { passive: true });

  function showTyping() {
    const wrapper = document.createElement("div");
    wrapper.className = "message ai-msg";
    wrapper.id = "typing-" + Date.now();
    wrapper.innerHTML = `<div class="bubble"><span class="sender-label">PerioDx</span><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    chatInner.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
    return wrapper.id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  /* ---------- Mobile & PC Speech Recognition ---------- */
  function setupSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      micBtn.style.opacity = "0.4";
      micBtn.title = "Voice input not supported on this browser";
      micBtn.disabled = true;
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = navigator.language || "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognizing = true;
      micBtn.classList.add("listening");
    };

    recognition.onend = () => {
      recognizing = false;
      micBtn.classList.remove("listening");
    };

    recognition.onerror = (event) => {
      recognizing = false;
      micBtn.classList.remove("listening");
      if (event.error === 'not-allowed') {
        alert("Microphone permission blocked. Please enable microphone access in your browser settings and ensure your connection uses HTTPS.");
      }
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const currentVal = inputField.value.trim();
      inputField.value = currentVal ? currentVal + " " + transcript : transcript;
      inputField.dispatchEvent(new Event('input'));
    };

    const handleMicToggle = (e) => {
      e.preventDefault();
      if (recognizing) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (err) {
          recognition.stop();
        }
      }
    };

    micBtn.addEventListener("click", handleMicToggle);
  }
</script>
</body>
</html>
